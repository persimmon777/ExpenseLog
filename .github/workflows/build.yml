# Сборка неподписанного Spent.ipa на облачном Mac.
# Подписывает .ipa SideStore на телефоне, поэтому здесь только ad-hoc подпись,
# которая нужна, чтобы в бинарнике остались entitlements (App Group).
name: Build IPA

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Check SMS parser vectors
        run: python3 Tools/parser_check.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Spent.xcodeproj \
            -scheme Spent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*\.swift|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Spent.app

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Ad-hoc sign with entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/Spent.app
          codesign --force --sign - --entitlements Widget/SpentWidget.entitlements "$APP/PlugIns/SpentWidget.appex"
          codesign --force --sign - --entitlements App/Spent.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Spent.app Payload/
          zip -qry Spent.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spent-ipa
          path: Spent.ipa

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Spent.ipa \
            --title "Spent — последняя сборка" \
            --notes "Сборка ${GITHUB_SHA::7}. Скачай Spent.ipa и открой в SideStore."
